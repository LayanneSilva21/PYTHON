{% extends 'base.html' %}
{% block content %}
    <h1>Adicionar Pessoa</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        <p>
            {{ form.name.label }}<br>
            {{ form.name(size=32) }}<br>
            {{ form.email.label }}<br>
            {{ form.email(size=32) }}<br>
            {{ form.submit() }}
        </p>
    </form>
{% endblock %}
